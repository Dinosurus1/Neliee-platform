# docker-compose.yml
# Levanta PostgreSQL local para desarrollo.
# La app (backend + frontend) se corre sin Docker (npm run dev / uvicorn).


services:
  postgres:
    image: postgres:16-alpine
    container_name: plataforma_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: NlK5rpwe8gSr36aSSuKvu87S2kiylgJVufvXe8WYBV4
      POSTGRES_DB:       Neliee_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  dashboard_db:
    image: postgres:16-alpine
    container_name: dashboard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: SzK3I8pAE-wqizn-xvx90ESUypXx32XxvLOHvpk-d2w
      POSTGRES_DB:       dashboard_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_dashboard:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
  pgdata_dashboard: