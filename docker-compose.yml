# docker-compose.yml
# Levanta PostgreSQL local para desarrollo.
# La app (backend + frontend) se corre sin Docker (npm run dev / uvicorn).

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: plataforma_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       plataforma_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: